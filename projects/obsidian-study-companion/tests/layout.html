<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--text-normal:#29272e;--text-muted:#706a79;--text-accent:#7150b8;--background-primary:#fff;--background-secondary:#f7f7f9;--background-modifier-border:#e7e4eb;--interactive-accent:#7150b8;--background-modifier-hover:#eee8f8;--font-interface:"Segoe UI","Microsoft YaHei",sans-serif;--font-text:"Segoe UI","Microsoft YaHei",sans-serif;--font-ui-medium:14px;--font-ui-small:13px;--font-ui-smaller:12px;--font-text-size:16px;--font-semibold:500;--radius-s:4px}
body{margin:0;background:var(--background-secondary);color:var(--text-normal)}
.workspace-leaf-content{height:720px;background:var(--background-primary)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--background-primary);border:1px solid var(--background-modifier-border);border-radius:5px;padding:6px 10px}
button{cursor:pointer}.mod-cta{background:var(--interactive-accent);color:white}button:disabled{opacity:.6}
.status-bar{position:fixed;bottom:0;right:0;height:27px;box-sizing:border-box;max-width:100%;padding:3px 8px;background:var(--background-secondary);font:12px/21px var(--font-interface)}
</style><link rel="stylesheet" href="../styles.css"></head>
<body><div class="workspace-leaf-content" data-type="study-companion-view"><div class="view-content sc-root"></div></div><div class="status-bar">0 个反向链接 · 0 个属性 · 320 字</div><script src="../.test-output/browser.js"></script></body></html>
